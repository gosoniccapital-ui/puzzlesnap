<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cun Style Advisor — Demo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    .preview-img { max-height: 280px; object-fit: contain; }
    /* Mobile frame simulator */
    .mobile-viewport {
      max-width: 420px;
      margin-left: auto;
      margin-right: auto;
      box-shadow: 0 20px 40px rgba(0,0,0,0.15);
      border-radius: 40px;
      border: 8px solid #1f2937;
      overflow: hidden;
      min-height: 840px;
      background: #fafafa;
    }
  </style>
</head>
<body class="bg-stone-900 min-h-screen text-stone-800">

  <!-- Top Toolbar Switcher (Wide | Mobile | Reset) -->
  <div class="sticky top-0 z-50 bg-stone-950/90 backdrop-blur text-stone-300 border-b border-stone-800 px-4 py-2.5 flex items-center justify-between shadow-lg">
    <div class="flex items-center gap-2">
      <span class="w-7 h-7 rounded-lg bg-pink-600 text-white font-extrabold flex items-center justify-center text-sm shadow">C</span>
      <span class="font-bold text-white text-sm hidden sm:inline">Cun Style Advisor Demo</span>
    </div>

    <!-- Switcher buttons -->
    <div class="flex items-center bg-stone-800/90 rounded-xl p-1 border border-stone-700">
      <button id="btnViewWide" onclick="setViewMode('wide')" class="px-3 py-1.5 rounded-lg text-xs font-bold transition flex items-center gap-1.5 bg-stone-700 text-white shadow">
        <i class="fa-solid fa-desktop"></i>
        <span>Wide</span>
      </button>
      <button id="btnViewMobile" onclick="setViewMode('mobile')" class="px-3 py-1.5 rounded-lg text-xs font-bold transition flex items-center gap-1.5 text-stone-400 hover:text-white">
        <i class="fa-solid fa-mobile-screen"></i>
        <span>Mobile</span>
      </button>
    </div>

    <div class="flex items-center gap-2">
      <button onclick="resetAll()" class="px-2.5 py-1.5 rounded-lg text-xs font-bold text-stone-400 hover:text-white hover:bg-stone-800 transition" title="Làm mới">
        <i class="fa-solid fa-rotate-right"></i>
      </button>
      <a href="https://cunfashion.com" target="_blank" class="px-3 py-1.5 rounded-lg text-xs font-bold bg-pink-600 hover:bg-pink-700 text-white transition">
        CunFashion.com
      </a>
    </div>
  </div>

  <!-- Container for App -->
  <div id="appContainer" class="py-6 transition-all duration-300">
    <div id="contentWrapper" class="bg-gray-50 min-h-screen p-4 sm:p-8 transition-all duration-300">
      <div class="max-w-4xl mx-auto">
        <!-- Header -->
        <div class="text-center mb-8">
          <h1 class="text-3xl font-extrabold text-gray-900 tracking-tight">Cun Style Advisor</h1>
          <p class="text-gray-500 mt-1.5 text-sm font-medium">Upload ảnh → Điền form → Nhận gợi ý + link affiliate</p>
        </div>

        <!-- Card: Upload & Form -->
        <div class="bg-white rounded-2xl shadow-sm border border-gray-200 p-6 mb-8">
          <!-- Upload Section -->
          <div class="mb-6">
            <div class="flex items-center justify-between mb-2">
              <label class="block text-sm font-bold text-gray-800">1. Upload ảnh trang phục / người mặc</label>
              <button id="btnClearImg" onclick="clearImage()" class="text-xs text-rose-600 hover:text-rose-700 font-bold hidden">✕ Xóa ảnh</button>
            </div>

            <div class="flex flex-wrap items-center gap-3">
              <input type="file" id="imageInput" accept="image/*" class="block w-full sm:w-auto text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-pink-50 file:text-pink-700 hover:file:bg-pink-100 transition cursor-pointer" />
              <button type="button" onclick="loadBlazerDemoImage()" class="text-xs bg-rose-50 hover:bg-rose-100 text-rose-700 font-bold py-2 px-3 rounded-xl border border-rose-200 transition flex items-center gap-1.5">
                <i class="fa-solid fa-wand-magic-sparkles text-rose-600"></i>
                <span>Thử ngay ảnh Blazer Đỏ (như hình)</span>
              </button>
            </div>

            <div id="preview" class="mt-4 hidden bg-gray-50 p-3 rounded-2xl border border-gray-200 text-center">
              <img id="previewImg" class="preview-img rounded-xl border border-gray-200 mx-auto shadow-sm" />
              <p id="fileNameLabel" class="text-xs text-gray-500 mt-2 font-medium"></p>
            </div>
          </div>

          <!-- Form Filters -->
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-bold uppercase tracking-wider text-gray-600 mb-1.5">Dịp sử dụng</label>
              <select id="occasion" class="w-full border border-gray-200 rounded-xl px-3.5 py-2.5 text-sm bg-gray-50 focus:bg-white focus:border-pink-500 focus:ring-2 focus:ring-pink-500/20 outline-none transition font-medium">
                <option value="casual">Casual / Hàng ngày</option>
                <option value="work" selected>Đi làm</option>
                <option value="date">Hẹn hò</option>
                <option value="party">Party / Sự kiện</option>
                <option value="travel">Du lịch</option>
              </select>
            </div>

            <div>
              <label class="block text-xs font-bold uppercase tracking-wider text-gray-600 mb-1.5">Phong cách</label>
              <select id="style" class="w-full border border-gray-200 rounded-xl px-3.5 py-2.5 text-sm bg-gray-50 focus:bg-white focus:border-pink-500 focus:ring-2 focus:ring-pink-500/20 outline-none transition font-medium">
                <option value="minimal">Minimal / Tối giản</option>
                <option value="elegant" selected>Elegant / Thanh lịch</option>
                <option value="street">Streetwear</option>
                <option value="romantic">Romantic / Nữ tính</option>
                <option value="classic">Classic</option>
              </select>
            </div>

            <div>
              <label class="block text-xs font-bold uppercase tracking-wider text-gray-600 mb-1.5">Ngân sách</label>
              <select id="budget" class="w-full border border-gray-200 rounded-xl px-3.5 py-2.5 text-sm bg-gray-50 focus:bg-white focus:border-pink-500 focus:ring-2 focus:ring-pink-500/20 outline-none transition font-medium">
                <option value="low">Dưới 500k</option>
                <option value="mid" selected>500k - 1.5tr</option>
                <option value="high">Trên 1.5tr</option>
              </select>
            </div>

            <div>
              <label class="block text-xs font-bold uppercase tracking-wider text-gray-600 mb-1.5">Màu ưa thích</label>
              <input type="text" id="color" placeholder="Ví dụ: hồng pastel, đen, be..." class="w-full border border-gray-200 rounded-xl px-3.5 py-2.5 text-sm bg-gray-50 focus:bg-white focus:border-pink-500 focus:ring-2 focus:ring-pink-500/20 outline-none transition font-medium" />
            </div>
          </div>

          <button onclick="analyze()" class="mt-6 w-full bg-gradient-to-r from-pink-600 to-rose-600 hover:from-pink-700 hover:to-rose-700 text-white font-bold py-3.5 rounded-xl shadow-lg shadow-pink-600/20 transition transform active:scale-[0.99] flex items-center justify-center gap-2 text-sm sm:text-base">
            <i class="fa-solid fa-wand-magic-sparkles"></i>
            <span>Phân tích & Gợi ý sản phẩm</span>
          </button>
        </div>

        <!-- Results -->
        <div id="result" class="hidden space-y-6">
          <div class="bg-white rounded-2xl shadow-sm border border-gray-200 p-6">
            <div class="flex items-center gap-2.5 mb-3">
              <span class="w-8 h-8 rounded-xl bg-pink-100 text-pink-600 flex items-center justify-center font-bold text-sm">💡</span>
              <h2 class="text-lg font-bold text-gray-900">Gợi ý phong cách</h2>
            </div>
            <p id="advice" class="text-gray-700 leading-relaxed text-sm bg-pink-50/50 p-4 rounded-xl border border-pink-100 font-medium"></p>
          </div>

          <div>
            <h2 class="text-lg font-bold text-gray-900 mb-4 flex items-center gap-2">
              <i class="fa-solid fa-bag-shopping text-pink-600"></i>
              <span>Sản phẩm gợi ý (Affiliate)</span>
            </h2>
            <div id="products" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Product Catalog với ảnh thật chất lượng cao (không dùng placeholder bị lỗi)
    const productDatabase = {
      work: [
        {
          name: "Áo Sơ Mi Lụa Hàn Cao Cấp",
          price: "520.000đ",
          img: "https://images.unsplash.com/photo-1598554747436-c9293d6a588f?w=500&auto=format&fit=crop&q=80",
          link: "https://cunfashion.com/shop/so-mi-lua-han",
          platform: "Shopee"
        },
        {
          name: "Quần Tây Ống Đứng Tôn Dáng",
          price: "480.000đ",
          img: "https://images.unsplash.com/photo-1509631179647-0177331693ae?w=500&auto=format&fit=crop&q=80",
          link: "https://cunfashion.com/shop/quan-tay-ong-dung",
          platform: "Shopee"
        },
        {
          name: "Blazer Dáng Suông 2 Lớp Cao Cấp",
          price: "890.000đ",
          img: "https://images.unsplash.com/photo-1591047139829-d91aecb6caea?w=500&auto=format&fit=crop&q=80",
          link: "https://cunfashion.com/shop/blazer-dang-suong",
          platform: "CunFashion"
        }
      ],
      casual: [
        {
          name: "Áo Thun Oversize Cotton",
          price: "289.000đ",
          img: "https://images.unsplash.com/photo-1521572267360-ee0c2909d518?w=500&auto=format&fit=crop&q=80",
          link: "https://cunfashion.com/shop/ao-thun-cotton",
          platform: "CunFashion"
        },
        {
          name: "Quần Jean Ống Rộng Retro",
          price: "450.000đ",
          img: "https://images.unsplash.com/photo-1541099649105-f69ad21f3246?w=500&auto=format&fit=crop&q=80",
          link: "https://cunfashion.com/shop/quan-jean-ong-rong",
          platform: "Shopee"
        },
        {
          name: "Sneaker Trắng Basic Đế Cao",
          price: "690.000đ",
          img: "https://images.unsplash.com/photo-1595950653106-6c9ebd614d3a?w=500&auto=format&fit=crop&q=80",
          link: "https://cunfashion.com/shop/sneaker-trang",
          platform: "TikTok Shop"
        }
      ],
      date: [
        {
          name: "Đầm Midi Voan Tơ Hoa Nhí",
          price: "650.000đ",
          img: "https://images.unsplash.com/photo-1572804013309-59a88b7e92f1?w=500&auto=format&fit=crop&q=80",
          link: "https://cunfashion.com/shop/dam-midi-voan",
          platform: "TikTok Shop"
        },
        {
          name: "Áo Kiểu Nơ Cổ Peplum",
          price: "320.000đ",
          img: "https://images.unsplash.com/photo-1564257631407-4deb1f99d992?w=500&auto=format&fit=crop&q=80",
          link: "https://cunfashion.com/shop/ao-kieu-no-co",
          platform: "Shopee"
        },
        {
          name: "Túi Xách Mini Kẹp Nách Da Nappa",
          price: "410.000đ",
          img: "https://images.unsplash.com/photo-1584917865442-de89df76afd3?w=500&auto=format&fit=crop&q=80",
          link: "https://cunfashion.com/shop/tui-xach-mini",
          platform: "CunFashion"
        }
      ],
      party: [
        {
          name: "Áo Croptop Lấp Lánh Ánh Kim",
          price: "380.000đ",
          img: "https://images.unsplash.com/photo-1566174053879-31528523f8ae?w=500&auto=format&fit=crop&q=80",
          link: "https://cunfashion.com/shop/ao-croptop-party",
          platform: "CunFashion"
        },
        {
          name: "Chân Váy Xếp Ly Da Cao Cấp",
          price: "420.000đ",
          img: "https://images.unsplash.com/photo-1583496661160-fb5886a0aaaa?w=500&auto=format&fit=crop&q=80",
          link: "https://cunfashion.com/shop/chan-vay-xep-ly",
          platform: "Shopee"
        },
        {
          name: "Giày Cao Gót Mũi Nhọn 7cm",
          price: "750.000đ",
          img: "https://images.unsplash.com/photo-1543163521-1bf539c55dd2?w=500&auto=format&fit=crop&q=80",
          link: "https://cunfashion.com/shop/giay-cao-got",
          platform: "Lazada"
        }
      ],
      travel: [
        {
          name: "Áo Khoác Gió Nhẹ Chống Nước",
          price: "560.000đ",
          img: "https://images.unsplash.com/photo-1548883354-7622d03aca27?w=500&auto=format&fit=crop&q=80",
          link: "https://cunfashion.com/shop/ao-khoac-gio",
          platform: "Shopee"
        },
        {
          name: "Quần Short Kaki Co Giãn",
          price: "290.000đ",
          img: "https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?w=500&auto=format&fit=crop&q=80",
          link: "https://cunfashion.com/shop/quan-short-kaki",
          platform: "TikTok Shop"
        },
        {
          name: "Mũ Bucket Canvas Dạo Phố",
          price: "180.000đ",
          img: "https://images.unsplash.com/photo-1576871337622-98d48d1cf531?w=500&auto=format&fit=crop&q=80",
          link: "https://cunfashion.com/shop/mu-bucket",
          platform: "Shopee"
        }
      ]
    };

    // Preview Upload Ảnh
    document.getElementById('imageInput').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(ev) {
          document.getElementById('previewImg').src = ev.target.result;
          document.getElementById('fileNameLabel').innerText = file.name;
          document.getElementById('preview').classList.remove('hidden');
          document.getElementById('btnClearImg').classList.remove('hidden');
        }
        reader.readAsDataURL(file);
      }
    });

    // Nạp ảnh mẫu Blazer Đỏ
    function loadBlazerDemoImage() {
      // Dùng ảnh thời trang blazer đỏ tương tự
      const demoImgUrl = "https://images.unsplash.com/photo-1591047139829-d91aecb6caea?w=600&auto=format&fit=crop&q=80";
      document.getElementById('previewImg').src = demoImgUrl;
      document.getElementById('fileNameLabel').innerText = "ZXixb.jpg (Blazer đỏ công sở)";
      document.getElementById('preview').classList.remove('hidden');
      document.getElementById('btnClearImg').classList.remove('hidden');
      document.getElementById('occasion').value = "work";
      document.getElementById('style').value = "elegant";
      document.getElementById('budget').value = "mid";
      document.getElementById('color').value = "đen, be, trung tính";
      analyze();
    }

    function clearImage() {
      document.getElementById('previewImg').src = "";
      document.getElementById('imageInput').value = "";
      document.getElementById('preview').classList.add('hidden');
      document.getElementById('btnClearImg').classList.add('hidden');
    }

    // Phân tích & Render
    function analyze() {
      const occasion = document.getElementById('occasion').value;
      const style = document.getElementById('style').value;
      const color = document.getElementById('color').value || "trung tính";

      const adviceText = `Dựa trên ảnh bạn upload và lựa chọn "${occasion}" + phong cách "${style}", mình gợi ý bạn nên tập trung vào tông màu ${color}.
Ưu tiên chất liệu thoáng mát, form dáng vừa vặn để tăng sự tự tin.
Kết hợp phụ kiện tối giản sẽ giúp outfit hài hòa và dễ ứng dụng hơn.`;

      document.getElementById('advice').innerText = adviceText;

      const products = productDatabase[occasion] || productDatabase.work;
      const container = document.getElementById('products');
      container.innerHTML = '';

      products.forEach(p => {
        container.innerHTML += `
          <div class="bg-white border border-gray-200 rounded-2xl overflow-hidden shadow-sm hover:shadow-md transition flex flex-col justify-between">
            <div class="aspect-[3/4] bg-gray-100 overflow-hidden relative">
              <img src="${p.img}" alt="${p.name}" class="w-full h-full object-cover hover:scale-105 transition duration-500" onerror="this.src='https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?w=500&auto=format&fit=crop&q=80'">
              <span class="absolute top-2 right-2 px-2 py-0.5 rounded text-[10px] font-bold bg-white/90 text-gray-800 shadow-sm">${p.platform}</span>
            </div>
            <div class="p-4">
              <h3 class="font-bold text-gray-900 text-sm">${p.name}</h3>
              <p class="text-pink-600 font-extrabold text-sm mt-1">${p.price}</p>
              <a href="${p.link}" target="_blank" class="mt-3 inline-flex items-center justify-center gap-1.5 w-full text-center bg-gray-900 hover:bg-pink-600 text-white text-xs font-bold py-2.5 rounded-xl transition shadow-sm">
                <span>Xem & Mua ngay</span>
                <i class="fa-solid fa-arrow-up-right-from-square text-[10px]"></i>
              </a>
            </div>
          </div>
        `;
      });

      document.getElementById('result').classList.remove('hidden');
      document.getElementById('result').scrollIntoView({ behavior: 'smooth' });
    }

    // Switcher View Mode (Wide vs Mobile)
    function setViewMode(mode) {
      const wrapper = document.getElementById('contentWrapper');
      const btnWide = document.getElementById('btnViewWide');
      const btnMobile = document.getElementById('btnViewMobile');

      if (mode === 'mobile') {
        wrapper.className = "mobile-viewport p-4 sm:p-6 transition-all duration-300";
        btnMobile.className = "px-3 py-1.5 rounded-lg text-xs font-bold transition flex items-center gap-1.5 bg-stone-700 text-white shadow";
        btnWide.className = "px-3 py-1.5 rounded-lg text-xs font-bold transition flex items-center gap-1.5 text-stone-400 hover:text-white";
      } else {
        wrapper.className = "bg-gray-50 min-h-screen p-4 sm:p-8 transition-all duration-300";
        btnWide.className = "px-3 py-1.5 rounded-lg text-xs font-bold transition flex items-center gap-1.5 bg-stone-700 text-white shadow";
        btnMobile.className = "px-3 py-1.5 rounded-lg text-xs font-bold transition flex items-center gap-1.5 text-stone-400 hover:text-white";
      }
    }

    function resetAll() {
      clearImage();
      document.getElementById('result').classList.add('hidden');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // Tự động load demo blazer đỏ ngay khi mở trang để Đại Ka thấy ngay kết quả như hình
    window.addEventListener('DOMContentLoaded', () => {
      loadBlazerDemoImage();
    });
  </script>
</body>
</html>
